name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rails-best-practices:
    name: Rails Best Practices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0.7'

      - uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-rails-best-practices-${{ hashFiles('Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-rails-best-practices-

      - name: Install dependencies
        run: |
          bundle config set --local path 'vendor/bundle'
          bundle config set --local with 'test'
          bundle install --jobs=4 --retry=3

      - name: Run Rails Best Practices
        run: bundle exec rails_best_practices -f html -c .rails_best_practices.yml

      - uses: actions/upload-artifact@v4
        with:
          name: rails-best-practices-report
          path: rails_best_practices_output.html
          if-no-files-found: warn

  rubocop:
    name: RuboCop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0.7'

      - uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-rubocop-${{ hashFiles('Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-rubocop-

      - name: Install dependencies
        run: |
          bundle config set --local path 'vendor/bundle'
          bundle config set --local with 'development test'
          bundle install --jobs=4 --retry=3

      - name: Run RuboCop
        run: bundle exec rubocop -f html --out report.html

      - uses: actions/upload-artifact@v4
        with:
          name: rubocop-report
          path: report.html
          if-no-files-found: warn
